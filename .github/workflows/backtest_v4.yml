name: Backtest v4

on:
  workflow_dispatch:
    inputs:
      base_asset:
        description: "Denominator asset (e.g. BTCUSDT, ETHUSDT)"
        required: false
        default: "BTCUSDT"
      quote_asset:
        description: "Numerator asset (e.g. ETHUSDT, BNBUSDT, XRPUSDT) — ratio computed is quote/base"
        required: false
        default: "ETHUSDT"
      days:
        description: "Days of real 1m history to test"
        required: false
        default: "30"

permissions:
  contents: write

jobs:
  backtest_v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run v4 (relative-value, any pair)
        working-directory: backtest
        run: |
          echo "V4_START: $(date -u +%s)"
          BASE="${{ github.event.inputs.base_asset || 'BTCUSDT' }}"
          QUOTE="${{ github.event.inputs.quote_asset || 'ETHUSDT' }}"
          OUTFILE="results/v4-${QUOTE}-${BASE}.md"
          python3 train_v4.py --source binance --base_asset "$BASE" --quote_asset "$QUOTE" --days "${{ github.event.inputs.days || '30' }}" --out "$OUTFILE"
          echo "V4_END: $(date -u +%s)"
          echo "OUTFILE=$OUTFILE" >> $GITHUB_ENV

      - name: Commit results
        run: |
          git config user.name "zuvarik-backtest-bot"
          git config user.email "actions@github.com"
          git add "backtest/${OUTFILE}"
          git diff --staged --quiet || git commit -m "chore: update v4 backtest results for ${OUTFILE} [automated]"
          git push
