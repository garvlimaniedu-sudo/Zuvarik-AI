name: Backtest v4

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of real 1m history to test (both BTCUSDT and ETHUSDT)"
        required: false
        default: "30"

permissions:
  contents: write

jobs:
  backtest_v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run v4 (ETH/BTC relative-value)
        working-directory: backtest
        run: |
          echo "V4_START: $(date -u +%s)"
          python3 train_v4.py --source binance --btc_asset BTCUSDT --eth_asset ETHUSDT --days "${{ github.event.inputs.days || '30' }}" --out results/v4.md
          echo "V4_END: $(date -u +%s)"

      - name: Commit results
        run: |
          git config user.name "zuvarik-backtest-bot"
          git config user.email "actions@github.com"
          git add backtest/results/v4.md
          git diff --staged --quiet || git commit -m "chore: update v4 backtest results [automated]"
          git push
